<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown Fest POP - Catálogo</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="Resources/Icono Crown Fest.png">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-container">
            <a href="index.html">
                <img id="headerLogo" src="Resources/Logo Crown Fest.png" alt="Logo" height="60" width="100">
            </a>
            <select class="dropdown">
                <option>Crown Fest POP</option>
                <option>Crown Fest ROCK</option>
                <option>Crown Fest INDIE</option>
                <option>Crown Fest JAZZ</option>
                <option>Crown Fest DEMBOW</option>
                <option>Otros Eventos</option>
            </select>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="catalogo.html" class="active">Catálogo</a>
            <a href="servicios.html">Servicios</a>
            <a href="artistas.html">Artistas</a>
            <a href="compra.html">Compra</a>
            <a href="contacto.html">Contacto</a>
            <a href="aboutUs.html">FaQ</a>
        </nav>
    </header>

    <!-- Hero Section with Poster -->
    <div class="hero-section">
        <div class="hero-poster">
            <img id="poster-placeholder" src="Resources/Banner_Pop.png" alt="Banner" height="600" width="1000">
        </div>
        <a href="entradas.html" class="btn-tickets">Comprar Tickets</a>
    </div>

    <!-- Featured Artists -->
    <div class="featured-artists">
        <h2>Artistas Destacados</h2>
        <div class="artists-grid">
            <div class="artist-card">
                <div class="artist-image">
                    <img id="artist-image-placeholder" src="Resources/TaylorSwift.png" alt="Logo" height="250" width="350">
                </div>
                <h3>1º Taylor Swift</h3>
            </div>
            <div class="artist-card">
                <div class="artist-image">
                    <img id="artist-image-placeholder" src="Resources/Beyonce.png" alt="Logo" height="250" width="350">
                </div>
                <h3>2º Beyoncé</h3>
            </div>
            <div class="artist-card">
                <div class="artist-image">
                    <img id="artist-image-placeholder" src="Resources/LadyGaga.png" alt="Logo" height="250" width="350">
                </div>
                <h3>3º Lady Gaga</h3>
            </div>
            <div class="artist-card">
                <div class="artist-image">
                    <img id="artist-image-placeholder" src="Resources/TheWeeknd.png" alt="Logo" height="250" width="350">
                </div>
                <h3>4º The Weeknd</h3>
            </div>
            <div class="artist-card">
                <div class="artist-image">
                    <img id="artist-image-placeholder" src="Resources/PaulMcCartney.png" alt="Logo" height="250" width="350">
                </div>
                <h3>5º Paul McCartney</h3>
            </div>
            <div class="artist-card">
                <div class="artist-image">
                    <img id="artist-image-placeholder" src="Resources/Rihanna.png" alt="Logo" height="250" width="350">
                </div>
                <h3>6º Rihanna</h3>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <img id="footerLogo" src="Resources/Logo Crown Fest Footer.png" alt="Logo" height="110" width="120">
            <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="servicios.html">Servicios</a>
            <a href="artistas.html">Artistas</a>
            <a href="compra.html">Compra</a>
            <a href="contacto.html">Contacto</a>
            <a href="aboutUs.html">Sobre Nosotros</a>
            </div>
            <div class="social-links">
                <a href="#" class="social-icon"><img id="instagram" src="Resources/Instagram.png" alt="instagram" height="30" width="50"></a>
                <a href="#" class="social-icon"><img id="facebook" src="Resources/Facebook.png" alt="facebook" height="30" width="50"></a>
                <a href="#" class="social-icon"><img id="twitter" src="Resources/X.png" alt="twitter" height="30" width="50"></a>
            
            </div>
        </div>
        <div class="footer-bottom">
            Diseño de Interfaces Web
            <a href="avisoLegal.html">Privacy Policy</a>
        </div>
    </footer>
</body>
</html>
